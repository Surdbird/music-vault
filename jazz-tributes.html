  { source:"Miles Davis",      target:"Gerry Mulligan",   song:"Jeru",                        year:1949, sp:"2nHkDL73RjjdSZPmaGQqcj", note:"Written for Mulligan on Birth of the Cool" },

  // ── ELVIS COSTELLO ──────────────────────────────────────────────────────
  { source:"Elvis Costello",   target:"Burt Bacharach",   song:"God Give Me Strength",        year:1996, sp:"5dNaXVHv1tGHLLm1V4NRGE", note:"Collaboration as sustained mutual tribute" },
];

// ── BUILD GRAPH ─────────────────────────────────────────────────────────────
const nodeMap = new Map();
tributeData.forEach(d => {
  [d.source, d.target].forEach(id => {
    if (!nodeMap.has(id)) nodeMap.set(id, { id, tributes:[], tributedBy:[] });
  });
  nodeMap.get(d.source).tributes.push(d);
  nodeMap.get(d.target).tributedBy.push(d);
});
const nodes = Array.from(nodeMap.values());
const links = tributeData.map(d => ({ ...d }));
const degree = id => nodeMap.get(id).tributes.length + nodeMap.get(id).tributedBy.length;
const maxDeg = Math.max(...nodes.map(n => degree(n.id)));
const rScale = d3.scaleSqrt().domain([1, maxDeg]).range([6, 26]);

// ── SVG ─────────────────────────────────────────────────────────────────────
const cont = document.getElementById("graph-container");
const svg  = d3.select("#graph");
const g    = svg.append("g");
const zoom = d3.zoom().scaleExtent([0.2, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);
const dims = () => ({ w: cont.clientWidth, h: cont.clientHeight });
let { w, h } = dims();

// ── SIMULATION ──────────────────────────────────────────────────────────────
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(d => Math.max(55, 150 - (degree(d.source.id||d.source) + degree(d.target.id||d.target)) * 3))
    .strength(0.35))
  .force("charge", d3.forceManyBody().strength(d => -300 - degree(d.id) * 18))
  .force("center",    d3.forceCenter(w/2, h/2))
  .force("collision", d3.forceCollide().radius(d => rScale(degree(d.id)) + 14));

// ── LINKS ───────────────────────────────────────────────────────────────────
const linkEl = g.selectAll(".link").data(links).join("line").attr("class","link");

// ── NODES ───────────────────────────────────────────────────────────────────
const nodeEl = g.selectAll(".node").data(nodes).join("g").attr("class","node")
  .call(d3.drag()
    .on("start",(e,d)=>{ if(!e.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
    .on("drag", (e,d)=>{ d.fx=e.x; d.fy=e.y; })
    .on("end",  (e,d)=>{ if(!e.active) sim.alphaTarget(0); d.fx=null; d.fy=null; }));

nodeEl.append("circle").attr("r", d => rScale(degree(d.id)));
nodeEl.append("text")
  .text(d => {
    const deg = degree(d.id);
    if (deg >= 5) return d.id;
    const parts = d.id.split(" ");
    return parts.length > 2 ? parts.slice(1).join(" ") : parts[parts.length-1];
  })
  .attr("dy", d => rScale(degree(d.id)) + 11)
  .style("font-size", d => degree(d.id) >= 5 ? "10.5px" : "9px");

sim.on("tick", () => {
  linkEl.attr("x1",d=>d.source.x).attr("y1",d=>d.source.y).attr("x2",d=>d.target.x).attr("y2",d=>d.target.y);
  nodeEl.attr("transform",d=>`translate(${d.x},${d.y})`);
});

// ── EDGE TOOLTIP ────────────────────────────────────────────────────────────
const tooltip = document.getElementById("edge-tooltip");
linkEl
  .on("mousemove", function(e,d) {
    const r = cont.getBoundingClientRect();
    tooltip.style.opacity = "1";
    tooltip.style.left = (e.clientX - r.left + 14) + "px";
    tooltip.style.top  = (e.clientY - r.top  - 10) + "px";
    const src = d.source.id||d.source, tgt = d.target.id||d.target;
    const spBtn = d.sp
      ? `<a class="sp-link" href="https://open.spotify.com/track/${d.sp}" target="_blank">▶ Listen on Spotify</a>`
      : `<span style="color:#b0a090;font-size:0.61rem">Not on Spotify</span>`;
    tooltip.innerHTML =
      `<div class="song-title">${d.song}${d.year?` (${d.year})`:""}</div>`+
      `<div class="tribute-line">${src} → ${tgt}</div>`+
      (d.note?`<div class="note-line">${d.note}</div>`:"")+
      `<div style="margin-top:0.35rem">${spBtn}</div>`;
  })
  .on("mouseleave", () => { tooltipHideTimer = setTimeout(() => { tooltip.style.opacity = "0"; }, 300); });

tooltip.addEventListener("mouseenter", () => { clearTimeout(tooltipHideTimer); });
tooltip.addEventListener("mouseleave", () => { tooltip.style.opacity = "0"; });
let tooltipHideTimer;

// ── NODE CLICK ──────────────────────────────────────────────────────────────
let selected = null;
const panel   = document.getElementById("detail-panel");
const resetBtn= document.getElementById("reset-btn");

function clearSelection() {
  selected = null;
  nodeEl.classed("dimmed highlighted selected", false);
  linkEl.classed("dimmed highlighted", false);
  panel.classList.remove("visible");
  resetBtn.classList.add("hidden");
  document.getElementById("search-box").value = "";
}

function selectNode(d) {
  selected = d.id;
  const conn = new Set([d.id]);
  const connL = new Set();
  links.forEach((l,i) => {
    const s=l.source.id||l.source, t=l.target.id||l.target;
    if (s===d.id||t===d.id) { conn.add(s); conn.add(t); connL.add(i); }
  });
  nodeEl.classed("dimmed",n=>!conn.has(n.id)).classed("highlighted",n=>conn.has(n.id)&&n.id!==d.id).classed("selected",n=>n.id===d.id);
  linkEl.classed("dimmed",(l,i)=>!connL.has(i)).classed("highlighted",(l,i)=>connL.has(i));
  document.getElementById("panel-name").textContent = d.id;

  const spTag = (t) => t.sp
    ? ` <a class="sp" href="https://open.spotify.com/track/${t.sp}" target="_blank">▶</a>` : "";

  document.getElementById("panel-tributes-to").innerHTML = d.tributes.length
    ? `<div class="section-label">Wrote tributes to</div><ul>${d.tributes.map(t=>
        `<li><span class="song">${t.song}</span> <span class="by">→ ${t.target.id||t.target}</span>${spTag(t)}</li>`).join("")}</ul>` : "";
  document.getElementById("panel-tributes-from").innerHTML = d.tributedBy.length
    ? `<div class="section-label">Was honoured by</div><ul>${d.tributedBy.map(t=>
        `<li><span class="song">${t.song}</span> <span class="by">by ${t.source.id||t.source}</span>${spTag(t)}</li>`).join("")}</ul>` : "";

  panel.classList.add("visible");
  resetBtn.classList.remove("hidden");
}

nodeEl.on("click",(e,d)=>{ e.stopPropagation(); selected===d.id?clearSelection():selectNode(d); });
svg.on("click", clearSelection);
document.getElementById("close-panel").onclick = clearSelection;
resetBtn.onclick = clearSelection;

// ── SEARCH ──────────────────────────────────────────────────────────────────
document.getElementById("search-box").addEventListener("input", function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { clearSelection(); return; }
  const match = nodes.find(d => d.id.toLowerCase().includes(q));
  if (match) selectNode(match);
});

document.getElementById("count-label").textContent =
  `${nodes.length} musicians · ${links.length} tribute connections · ${links.filter(l=>l.sp).length} on Spotify`;

window.addEventListener("resize", () => {
  const s = dims();
  sim.force("center", d3.forceCenter(s.w/2, s.h/2)).alpha(0.1).restart();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Tributes — A Map of Homage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #080705; color: #d4c9b0; font-family: 'Courier Prime', monospace; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  header { padding: 1rem 1.5rem 0.7rem; border-bottom: 1px solid #2a2218; flex-shrink: 0; display: flex; align-items: baseline; gap: 1.5rem; flex-wrap: wrap; }
  header h1 { font-family: 'IM Fell English', Georgia, serif; font-size: 1.25rem; font-weight: 400; color: #e8d9b8; letter-spacing: 0.02em; white-space: nowrap; }
  header p { font-size: 0.65rem; color: #5a5040; letter-spacing: 0.07em; text-transform: uppercase; flex: 1; min-width: 180px; }
  #hint { font-size: 0.63rem; color: #3d3428; letter-spacing: 0.05em; white-space: nowrap; }
  #graph-container { flex: 1; position: relative; overflow: hidden; }
  svg { width: 100%; height: 100%; }

  .link { stroke: #6b4a2a; stroke-opacity: 0.45; stroke-width: 1; cursor: pointer; transition: stroke-opacity 0.2s, stroke-width 0.2s; }
  .link:hover { stroke: #d4845a; stroke-opacity: 1; stroke-width: 2; }
  .link.dimmed { stroke-opacity: 0.04; pointer-events: none; }
  .link.highlighted { stroke: #d4845a; stroke-opacity: 0.85; stroke-width: 1.5; }

  .node circle { fill: #b8823a; stroke: #1a1510; stroke-width: 1.5; cursor: pointer; transition: fill 0.2s, r 0.2s; }
  .node.dimmed circle { fill: #1e1a14; stroke: #1e1a14; pointer-events: none; }
  .node.highlighted circle { fill: #e0aa60; stroke: #d4845a; stroke-width: 2; }
  .node.selected circle { fill: #f0d090; stroke: #e8c060; stroke-width: 2.5; }
  .node text { font-family: 'Courier Prime', monospace; font-size: 9.5px; fill: #7a6a50; pointer-events: none; text-anchor: middle; transition: fill 0.2s, font-size 0.2s; }
  .node.highlighted text, .node.selected text { fill: #e8d9b8; }
  .node.dimmed text { fill: #1e1a14; }

  #edge-tooltip { position: absolute; background: #0d0a06; border: 1px solid #3a2e1e; padding: 0.5rem 0.8rem; font-size: 0.68rem; color: #c0a870; pointer-events: none; opacity: 0; transition: opacity 0.12s; max-width: 230px; line-height: 1.6; z-index: 10; border-left: 2px solid #d4845a; }
  #edge-tooltip .song-title { color: #d4845a; font-style: italic; font-size: 0.75rem; }
  #edge-tooltip .tribute-line { color: #6b5a40; font-size: 0.63rem; margin-top: 0.15rem; }
  #edge-tooltip .note-line { color: #5a4a32; font-size: 0.62rem; margin-top: 0.1rem; font-style: italic; }

  #detail-panel { position: absolute; right: 1.25rem; top: 1.25rem; width: 230px; background: #0c0906; border: 1px solid #2a2218; padding: 1.1rem; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
  #detail-panel.visible { opacity: 1; pointer-events: auto; }
  #detail-panel .musician-name { font-family: 'IM Fell English', Georgia, serif; font-size: 1.05rem; color: #e8d9b8; margin-bottom: 0.6rem; border-bottom: 1px solid #2a2218; padding-bottom: 0.45rem; padding-right: 1.2rem; line-height: 1.3; }
  #detail-panel .section-label { font-size: 0.58rem; letter-spacing: 0.12em; text-transform: uppercase; color: #5a5040; margin-bottom: 0.35rem; margin-top: 0.65rem; }
  #detail-panel ul { list-style: none; font-size: 0.67rem; color: #7a6a50; line-height: 1.75; }
  #detail-panel ul li .song { color: #c8913a; font-style: italic; }
  #detail-panel ul li .by { color: #4a4030; }
  #close-panel { position: absolute; top: 0.5rem; right: 0.65rem; background: none; border: none; color: #4a4030; cursor: pointer; font-size: 0.85rem; font-family: monospace; line-height: 1; }
  #close-panel:hover { color: #d4845a; }

  #controls { position: absolute; bottom: 1.25rem; left: 1.25rem; display: flex; gap: 0.5rem; align-items: center; }
  .ctrl-btn { background: none; border: 1px solid #2a2218; color: #4a4030; font-family: 'Courier Prime', monospace; font-size: 0.62rem; letter-spacing: 0.07em; text-transform: uppercase; padding: 0.35rem 0.65rem; cursor: pointer; transition: all 0.15s; }
  .ctrl-btn:hover { border-color: #d4845a; color: #d4845a; }
  .ctrl-btn.hidden { opacity: 0; pointer-events: none; }

  #search-box { background: #0c0906; border: 1px solid #2a2218; color: #c0a870; font-family: 'Courier Prime', monospace; font-size: 0.68rem; padding: 0.35rem 0.65rem; width: 150px; outline: none; }
  #search-box::placeholder { color: #3a3020; }
  #search-box:focus { border-color: #5a4a30; }

  #count-label { position: absolute; bottom: 1.25rem; right: 1.25rem; font-size: 0.6rem; color: #3a3020; letter-spacing: 0.05em; }

  .search-highlight circle { fill: #f0d090 !important; stroke: #e8c060 !important; stroke-width: 2.5 !important; }
</style>
</head>
<body>
<header>
  <h1>A Map of Homage</h1>
  <p>Jazz as a network of tributes — songs written for, about, and in response to other musicians</p>
  <span id="hint">Click · Hover · Drag · Scroll to zoom</span>
</header>
<div id="graph-container">
  <svg id="graph"></svg>
  <div id="edge-tooltip"></div>
  <div id="detail-panel">
    <button id="close-panel">✕</button>
    <div class="musician-name" id="panel-name"></div>
    <div id="panel-tributes-to"></div>
    <div id="panel-tributes-from"></div>
  </div>
  <div id="controls">
    <input id="search-box" type="text" placeholder="Search musician…" autocomplete="off">
    <button class="ctrl-btn hidden" id="reset-btn">Clear</button>
  </div>
  <div id="count-label"></div>
</div>

<script>
const tributeData = [
  // ── ELLINGTON hub ───────────────────────────────────────────────
  { source: "Duke Ellington", target: "John Coltrane",    song: "Take the Coltrane",              year: 1962 },
  { source: "Duke Ellington", target: "Billy Strayhorn",  song: "Lotus Blossom",                  year: 1967, note: "Written on Strayhorn's death" },
  { source: "Duke Ellington", target: "Louis Armstrong",  song: "Portrait of Louis Armstrong",    year: 1962 },
  { source: "Duke Ellington", target: "Mahalia Jackson",  song: "Come Sunday",                    year: 1943, note: "Written in homage to Black sacred tradition" },
  { source: "Charles Mingus",      target: "Duke Ellington", song: "Open Letter to Duke",         year: 1959 },
  { source: "John Coltrane",       target: "Duke Ellington", song: "In a Mellotone",              year: 1962 },
  { source: "Art Ensemble of Chicago", target: "Duke Ellington", song: "Charlie M.",             year: 1974, note: "Also nods to Charlie Parker" },
  { source: "Miles Davis",         target: "Duke Ellington", song: "He Loved Him Madly",         year: 1974, note: "Recorded a month after Ellington's death" },
  { source: "Dave Brubeck",        target: "Duke Ellington", song: "The Duke",                   year: 1955 },
  { source: "Stevie Wonder",       target: "Duke Ellington", song: "Sir Duke",                   year: 1976 },
  { source: "Abdullah Ibrahim",    target: "Duke Ellington", song: "Duke Ellington Suite",       year: 1974 },
  { source: "Oscar Peterson",      target: "Duke Ellington", song: "Salute to Duke",             year: 1952 },

  // ── CHARLIE PARKER hub ──────────────────────────────────────────
  { source: "Miles Davis",         target: "Charlie Parker", song: "Donna Lee",                  year: 1947 },
  { source: "Ornette Coleman",     target: "Charlie Parker", song: "Bird Food",                  year: 1960 },
  { source: "Charles Mingus",      target: "Charlie Parker", song: "Bird Calls",                 year: 1961 },
  { source: "Lennie Tristano",     target: "Charlie Parker", song: "Requiem",                    year: 1956 },
  { source: "Dizzy Gillespie",     target: "Charlie Parker", song: "Anthropology",               year: 1945, note: "Co-written, Bird's spirit throughout" },
  { source: "Lee Morgan",          target: "Charlie Parker", song: "Tom Cat",                    year: 1964, note: "Hard-bop homage to Bird's influence" },

  // ── JOHN COLTRANE hub ───────────────────────────────────────────
  { source: "McCoy Tyner",         target: "John Coltrane", song: "For Trane",                   year: 1973 },
  { source: "Pharoah Sanders",     target: "John Coltrane", song: "To John",                    year: 1973 },
  { source: "Wayne Shorter",       target: "John Coltrane", song: "Trane",                      year: 1964 },
  { source: "Alice Coltrane",      target: "John Coltrane", song: "A Love Supreme (reprise)",   year: 1972, note: "Performed as memorial" },
  { source: "Carlos Santana",      target: "John Coltrane", song: "A Love Supreme (live)",      year: 2000, note: "Persistent live tribute" },
  { source: "Ravi Shankar",        target: "John Coltrane", song: "Offering: To John Coltrane", year: 1982 },

  // ── MILES DAVIS hub ─────────────────────────────────────────────
  { source: "Miles Davis",         target: "Dizzy Gillespie", song: "Diggin' Diz",              year: 1951 },
  { source: "John Coltrane",       target: "Miles Davis",   song: "Miles' Mode",                year: 1963 },
  { source: "Herbie Hancock",      target: "Miles Davis",   song: "Tribute to Miles",           year: 1994 },
  { source: "Keith Jarrett",       target: "Miles Davis",   song: "Miles Davis Died Today",     year: 1991, note: "Improvised on day of his death" },

  // ── THELONIOUS MONK hub ─────────────────────────────────────────
  { source: "Thelonious Monk",     target: "Bud Powell",    song: "In Walked Bud",              year: 1948 },
  { source: "John Coltrane",       target: "Thelonious Monk", song: "Monk's Mood",              year: 1957, note: "Coltrane's famous Riverside reading" },
  { source: "Miles Davis",         target: "Thelonious Monk", song: "Well You Needn't",         year: 1954 },
  { source: "Steve Lacy",          target: "Thelonious Monk", song: "Monk's Dream",             year: 1963, note: "Lacy spent a decade performing only Monk" },
  { source: "Abdullah Ibrahim",    target: "Thelonious Monk", song: "Monk Suite",               year: 1986 },
  { source: "Jimmy Rowles",        target: "Thelonious Monk", song: "Ballad of Thelonious Monk", year: 1976 },
  { source: "Benny Bailey",        target: "Thelonious Monk", song: "Thelonious Assault",       year: 1961 },

  // ── LESTER YOUNG hub ────────────────────────────────────────────
  { source: "Charles Mingus",      target: "Lester Young",  song: "Goodbye Pork Pie Hat",       year: 1959, note: "Written on Lester's death" },
  { source: "John Coltrane",       target: "Lester Young",  song: "Lester Left Town",           year: 1958 },
  { source: "Billie Holiday",      target: "Lester Young",  song: "Fine and Mellow",            year: 1939, note: "Their bond was jazz's great friendship" },
  { source: "Joni Mitchell",       target: "Lester Young",  song: "Goodbye Pork Pie Hat (vocal)", year: 1979, note: "Mitchell's own lyric over Mingus's melody" },

  // ── CHARLES MINGUS ──────────────────────────────────────────────
  { source: "Charles Mingus",      target: "Fats Navarro",  song: "Portrait of Fats",           year: 1964 },
  { source: "Charles Mingus",      target: "Billie Holiday", song: "Eclipse",                   year: 1954 },
  { source: "Charles Mingus",      target: "Charlie Parker", song: "Bird Calls",                year: 1961 },
  { source: "Joni Mitchell",       target: "Charles Mingus", song: "The Dry Cleaner from Des Moines", year: 1979, note: "Collaboration on Mingus album" },

  // ── BILLIE HOLIDAY ──────────────────────────────────────────────
  { source: "Lester Young",        target: "Billie Holiday", song: "Lady Be Good",              year: 1936, note: "Lester named her Lady Day" },
  { source: "Abbey Lincoln",       target: "Billie Holiday", song: "For All We Know",           year: 1961, note: "Lincoln's vocal style consciously echoes Holiday" },

  // ── CLIFFORD BROWN ──────────────────────────────────────────────
  { source: "Benny Golson",        target: "Clifford Brown", song: "I Remember Clifford",       year: 1956, note: "Written immediately after Brown's death" },
  { source: "Lee Morgan",          target: "Clifford Brown", song: "Clifford's Axe",            year: 1957 },
  { source: "Miles Davis",         target: "Clifford Brown", song: "Dig",                       year: 1951, note: "Miles admired Brownie deeply" },

  // ── LOUIS ARMSTRONG ─────────────────────────────────────────────
  { source: "Dizzy Gillespie",     target: "Louis Armstrong", song: "Pops' Confessin'",         year: 1954 },
  { source: "Miles Davis",         target: "Louis Armstrong", song: "Louis' Blues",             year: 1961 },

  // ── BUD POWELL ──────────────────────────────────────────────────
  { source: "Charles Mingus",      target: "Bud Powell",    song: "Eulogy for Rudy Williams",   year: 1957 },
  { source: "Kenny Drew",          target: "Bud Powell",    song: "For Bud",                    year: 1964 },

  // ── DIZZY GILLESPIE ─────────────────────────────────────────────
  { source: "Dizzy Gillespie",     target: "Woody Herman",  song: "Woody 'n You",               year: 1944 },
  { source: "Charlie Parker",      target: "Dizzy Gillespie", song: "Anthropology",             year: 1945, note: "Co-written" },

  // ── BILL EVANS ──────────────────────────────────────────────────
  { source: "Miles Davis",         target: "Bill Evans",    song: "Peace Piece (influenced)",   year: 1958, note: "Miles cited Evans throughout Kind of Blue sessions" },
  { source: "Jim Hall",            target: "Bill Evans",    song: "Intermodulation",            year: 1966, note: "Deep collaborative homage" },
  { source: "Don Friedman",        target: "Scott LaFaro",  song: "Memory of Scotty",           year: 1962, note: "LaFaro died aged 25" },

  // ── SCOTT LAFARO ────────────────────────────────────────────────
  { source: "Bill Evans",          target: "Scott LaFaro",  song: "Peace Piece (memorial perf)", year: 1961, note: "Evans played after LaFaro's death at 25" },

  // ── ORNETTE COLEMAN ─────────────────────────────────────────────
  { source: "Pat Metheny",         target: "Ornette Coleman", song: "Rejoicing",                year: 1983 },
  { source: "Charlie Haden",       target: "Ornette Coleman", song: "Song for Che",             year: 1969 },
  { source: "Keith Jarrett",       target: "Ornette Coleman", song: "Song for Ornette",         year: 1975 },

  // ── SONNY ROLLINS ───────────────────────────────────────────────
  { source: "John Coltrane",       target: "Sonny Rollins",  song: "Tenor Madness",             year: 1956, note: "Famous summit session" },
  { source: "Sonny Rollins",       target: "Philly Joe Jones", song: "Blues for Philly Joe",    year: 1957 },
  { source: "Sonny Rollins",       target: "Clifford Brown", song: "I Know",                    year: 1957, note: "Rollins was in Brown's quintet" },

  // ── DJANGO REINHARDT ────────────────────────────────────────────
  { source: "John Lewis",          target: "Django Reinhardt", song: "Django",                  year: 1954, note: "MJQ classic, written on Django's death" },
  { source: "Charlie Byrd",        target: "Django Reinhardt", song: "Hot Club du Concord",     year: 1988 },

  // ── WAYNE SHORTER ───────────────────────────────────────────────
  { source: "Wayne Shorter",       target: "Billy Strayhorn", song: "Sweet Pea",                year: 1964 },
  { source: "Joe Zawinul",         target: "Cannonball Adderley", song: "Cannonball",           year: 1977, note: "After Adderley's death" },

  // ── CANNONBALL ADDERLEY ─────────────────────────────────────────
  { source: "Horace Silver",       target: "Art Blakey",    song: "The Preacher (homage)",      year: 1955, note: "Silver shaped his style under Blakey" },

  // ── ART BLAKEY ──────────────────────────────────────────────────
  { source: "Tony Allen",          target: "Art Blakey",    song: "The Source",                 year: 2017 },
  { source: "Clifford Brown",      target: "Art Blakey",    song: "Blues March (featured)",     year: 1954, note: "Brown's breakthrough with Blakey's Messengers" },

  // ── HORACE SILVER ───────────────────────────────────────────────
  { source: "Horace Silver",       target: "Big Nick Nicholas", song: "Song for My Father",     year: 1964, note: "Inspired by his Cape Verdean father" },
  { source: "Louis Hayes",         target: "Horace Silver",  song: "Serenade for Horace",      year: 2017 },

  // ── CHARLIE HADEN ───────────────────────────────────────────────
  { source: "Charlie Haden",       target: "Billie Holiday", song: "We Shall Overcome (for Lady Day)", year: 1969 },
  { source: "Pat Metheny",         target: "Charlie Haden",  song: "Haden's Happiness",        year: 1992 },

  // ── JACO PASTORIUS ──────────────────────────────────────────────
  { source: "Joe Zawinul",         target: "Jaco Pastorius", song: "Cannonball (intro features Jaco)", year: 1977, note: "Jaco's Weather Report debut was also Zawinul's Adderley elegy" },
  { source: "Bob Mintzer",         target: "Jaco Pastorius", song: "I Remember Jaco",          year: 1994 },

  // ── ALBERT AYLER ────────────────────────────────────────────────
  { source: "John Coltrane",       target: "Albert Ayler",   song: "Reverend King (influenced)", year: 1966, note: "Late Coltrane openly cited Ayler's impact" },
  { source: "Ornette Coleman",     target: "Albert Ayler",   song: "Holy Ghost (homage)",      year: 1971 },

  // ── RAVI SHANKAR / WORLD connections ────────────────────────────
  { source: "John Coltrane",       target: "Ravi Shankar",   song: "India",                    year: 1961, note: "Coltrane studied with Shankar; song dedicated to him" },
  { source: "Ravi Shankar",        target: "John Coltrane",  song: "Offering: To John Coltrane", year: 1982 },

  // ── BILLY STRAYHORN ─────────────────────────────────────────────
  { source: "Wayne Shorter",       target: "Billy Strayhorn", song: "Sweet Pea",                year: 1964 },
  { source: "Duke Ellington",      target: "Billy Strayhorn", song: "Lotus Blossom",            year: 1967 },

  // ── ELLA FITZGERALD ─────────────────────────────────────────────
  { source: "Ella Fitzgerald",     target: "Duke Ellington", song: "Sings the Duke Ellington Songbook", year: 1957 },

  // ── EXTRA modern / cross-genre ──────────────────────────────────
  { source: "Joni Mitchell",       target: "Lester Young",   song: "Goodbye Pork Pie Hat",      year: 1979 },
  { source: "Carlos Santana",      target: "John Coltrane",  song: "A Love Supreme (live)",     year: 2000 },
  { source: "Stevie Wonder",       target: "Duke Ellington", song: "Sir Duke",                  year: 1976 },
];

// ── BUILD GRAPH ─────────────────────────────────────────────────────────────
const nodeMap = new Map();
tributeData.forEach(d => {
  [d.source, d.target].forEach(id => {
    if (!nodeMap.has(id)) nodeMap.set(id, { id, tributes: [], tributedBy: [] });
  });
  nodeMap.get(d.source).tributes.push(d);
  nodeMap.get(d.target).tributedBy.push(d);
});

const nodes = Array.from(nodeMap.values());
const links = tributeData.map(d => ({ ...d }));

const degree = id => nodeMap.get(id).tributes.length + nodeMap.get(id).tributedBy.length;
const maxDeg = Math.max(...nodes.map(n => degree(n.id)));
const rScale = d3.scaleSqrt().domain([1, maxDeg]).range([6, 24]);

// ── SVG SETUP ───────────────────────────────────────────────────────────────
const container = document.getElementById("graph-container");
const svg = d3.select("#graph");
const g = svg.append("g");

const zoom = d3.zoom().scaleExtent([0.25, 4]).on("zoom", e => g.attr("transform", e.transform));
svg.call(zoom);

function dims() { return { w: container.clientWidth, h: container.clientHeight }; }
let { w, h } = dims();

// ── SIMULATION ──────────────────────────────────────────────────────────────
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id)
    .distance(d => Math.max(55, 150 - (degree(d.source.id || d.source) + degree(d.target.id || d.target)) * 3))
    .strength(0.35))
  .force("charge", d3.forceManyBody().strength(d => -300 - degree(d.id) * 15))
  .force("center", d3.forceCenter(w / 2, h / 2))
  .force("collision", d3.forceCollide().radius(d => rScale(degree(d.id)) + 14));

// ── LINKS ───────────────────────────────────────────────────────────────────
const linkEl = g.selectAll(".link").data(links).join("line").attr("class", "link");

// ── NODES ───────────────────────────────────────────────────────────────────
const nodeEl = g.selectAll(".node").data(nodes).join("g").attr("class", "node")
  .call(d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag",  (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end",   (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));

nodeEl.append("circle").attr("r", d => rScale(degree(d.id)));
nodeEl.append("text")
  .text(d => {
    const deg = degree(d.id);
    if (deg >= 5) return d.id; // full name for major nodes
    const parts = d.id.split(" ");
    return parts.length > 2 ? parts.slice(1).join(" ") : parts[parts.length - 1];
  })
  .attr("dy", d => rScale(degree(d.id)) + 11)
  .style("font-size", d => degree(d.id) >= 5 ? "10.5px" : "9px");

// ── TICK ────────────────────────────────────────────────────────────────────
sim.on("tick", () => {
  linkEl.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
  nodeEl.attr("transform", d => `translate(${d.x},${d.y})`);
});

// ── EDGE TOOLTIP ────────────────────────────────────────────────────────────
const tooltip = document.getElementById("edge-tooltip");
linkEl
  .on("mousemove", function(e, d) {
    const r = container.getBoundingClientRect();
    tooltip.style.opacity = "1";
    tooltip.style.left = (e.clientX - r.left + 14) + "px";
    tooltip.style.top  = (e.clientY - r.top  - 10) + "px";
    const src = d.source.id || d.source;
    const tgt = d.target.id || d.target;
    tooltip.innerHTML =
      `<div class="song-title">${d.song}${d.year ? ` (${d.year})` : ""}</div>` +
      `<div class="tribute-line">${src} → ${tgt}</div>` +
      (d.note ? `<div class="note-line">${d.note}</div>` : "");
  })
  .on("mouseleave", () => { tooltip.style.opacity = "0"; });

// ── NODE CLICK SPOTLIGHT ────────────────────────────────────────────────────
let selected = null;
const panel     = document.getElementById("detail-panel");
const resetBtn  = document.getElementById("reset-btn");

function clearSelection() {
  selected = null;
  nodeEl.classed("dimmed highlighted selected", false);
  linkEl.classed("dimmed highlighted", false);
  panel.classList.remove("visible");
  resetBtn.classList.add("hidden");
  document.getElementById("search-box").value = "";
}

function selectNode(d) {
  selected = d.id;
  const connected = new Set([d.id]);
  const connLinks  = new Set();
  links.forEach((l, i) => {
    const s = l.source.id || l.source, t = l.target.id || l.target;
    if (s === d.id || t === d.id) { connected.add(s); connected.add(t); connLinks.add(i); }
  });

  nodeEl
    .classed("dimmed",      n => !connected.has(n.id))
    .classed("highlighted", n =>  connected.has(n.id) && n.id !== d.id)
    .classed("selected",    n =>  n.id === d.id);
  linkEl
    .classed("dimmed",      (l, i) => !connLinks.has(i))
    .classed("highlighted", (l, i) =>  connLinks.has(i));

  // Panel
  document.getElementById("panel-name").textContent = d.id;
  const toDiv   = document.getElementById("panel-tributes-to");
  const fromDiv = document.getElementById("panel-tributes-from");
  toDiv.innerHTML   = d.tributes.length
    ? `<div class="section-label">Wrote tributes to</div><ul>${d.tributes.map(t =>
        `<li><span class="song">${t.song}</span> <span class="by">→ ${t.target}</span></li>`).join("")}</ul>` : "";
  fromDiv.innerHTML = d.tributedBy.length
    ? `<div class="section-label">Was honoured by</div><ul>${d.tributedBy.map(t =>
        `<li><span class="song">${t.song}</span> <span class="by">by ${t.source}</span></li>`).join("")}</ul>` : "";

  panel.classList.add("visible");
  resetBtn.classList.remove("hidden");
}

nodeEl.on("click", (e, d) => { e.stopPropagation(); selected === d.id ? clearSelection() : selectNode(d); });
svg.on("click", clearSelection);
document.getElementById("close-panel").onclick = clearSelection;
resetBtn.onclick = clearSelection;

// ── SEARCH ──────────────────────────────────────────────────────────────────
document.getElementById("search-box").addEventListener("input", function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { nodeEl.classed("search-highlight", false); return; }
  nodeEl.classed("search-highlight", d => d.id.toLowerCase().includes(q));
  const match = nodes.find(d => d.id.toLowerCase().includes(q));
  if (match) selectNode(match);
});

// ── COUNT ───────────────────────────────────────────────────────────────────
document.getElementById("count-label").textContent =
  `${nodes.length} musicians · ${links.length} tribute connections`;

// ── RESIZE ──────────────────────────────────────────────────────────────────
window.addEventListener("resize", () => {
  const s = dims();
  sim.force("center", d3.forceCenter(s.w / 2, s.h / 2)).alpha(0.1).restart();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Vault — Weekly Chat Summary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=DM+Mono:wght@300;400;500&display=swap');

  :root {
    --bg: #0e0c0a;
    --surface: #161310;
    --border: #2a2420;
    --gold: #c8943a;
    --gold-dim: #7a5820;
    --text: #e8e0d4;
    --muted: #6b5c48;
    --sp: #1db954;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; padding: 2rem; }

  header { max-width: 800px; margin: 0 auto 2.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1.5rem; }
  .eyebrow { font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); margin-bottom: 0.5rem; }
  h1 { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem,4vw,3rem); font-weight: 900; line-height: 1.1; }
  h1 em { color: var(--gold); font-style: normal; }
  .subtitle { font-size: 0.75rem; color: var(--muted); margin-top: 0.5rem; }

  .container { max-width: 800px; margin: 0 auto; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 2px; padding: 1.5rem; margin-bottom: 1.5rem; }
  .card-label { font-size: 0.6rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 1rem; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 4px;
    padding: 2rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s;
    color: var(--muted);
    font-size: 0.8rem;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--gold); color: var(--text); }
  .drop-zone.loaded { border-color: var(--sp); color: var(--sp); }

  .week-select { margin-top: 1rem; display: none; }
  .week-select select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 0.85rem;
    padding: 0.65rem 1rem;
    border-radius: 2px;
    cursor: pointer;
  }

  .btn {
    font-family: 'DM Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.05em;
    padding: 0.65rem 1.5rem;
    border-radius: 2px;
    border: none;
    cursor: pointer;
    transition: opacity 0.15s;
    margin-top: 1rem;
    width: 100%;
  }
  .btn-gold { background: var(--gold); color: #0a0806; font-weight: 500; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn:not(:disabled):hover { opacity: 0.85; }

  .loading { display: none; text-align: center; padding: 2rem; color: var(--muted); font-size: 0.8rem; }
  .loading.active { display: block; }
  .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 0.5rem; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Summary output */
  .summary { display: none; }
  .summary.active { display: block; }

  .summary-header {
    background: linear-gradient(135deg, #1a1208 0%, #0e0c0a 100%);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 1.5rem;
    margin-bottom: 1.5rem;
    text-align: center;
  }
  .summary-header h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 0.3rem; }
  .summary-header p { font-size: 0.72rem; color: var(--muted); }

  .summary-section { margin-bottom: 1.5rem; }
  .section-title {
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold-dim);
    margin-bottom: 0.75rem;
    padding-bottom: 0.4rem;
    border-bottom: 1px solid var(--border);
  }
  .summary-content {
    font-size: 0.82rem;
    line-height: 1.8;
    color: var(--text);
    white-space: pre-wrap;
  }

  .highlight-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--gold);
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
    border-radius: 0 2px 2px 0;
    font-size: 0.8rem;
    line-height: 1.6;
  }

  .stat-row { display: flex; gap: 2rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .stat { display: flex; flex-direction: column; gap: 0.15rem; }
  .stat-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; color: var(--gold); line-height: 1; }
  .stat-label { font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 0.65rem;
    padding: 0.3rem 0.75rem;
    border-radius: 2px;
    cursor: pointer;
    float: right;
    margin-top: -0.2rem;
  }
  .copy-btn:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>

<header>
  <div class="eyebrow">The Vault · Curator Tools</div>
  <h1>Weekly<br><em>Chat Summary</em></h1>
  <p class="subtitle">Drop a WhatsApp export, pick a week, and get an AI-generated summary of the conversations and music highlights.</p>
</header>

<div class="container">

  <div class="card">
    <div class="card-label">01 · Chat Export</div>
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <div>Drop WhatsApp .txt export here</div>
      <div style="margin-top:0.3rem;font-size:0.7rem">or click to browse</div>
    </div>
    <input type="file" id="fileInput" accept=".txt,.zip" style="display:none" onchange="handleFile(this.files[0])">

    <div class="week-select" id="weekSelect">
      <select id="weekDropdown" onchange="updateStats()">
        <option value="">Select a week...</option>
      </select>
    </div>

    <div id="statsRow" class="stat-row" style="margin-top:1rem;display:none">
      <div class="stat"><div class="stat-num" id="statMessages">0</div><div class="stat-label">Messages</div></div>
      <div class="stat"><div class="stat-num" id="statMembers">0</div><div class="stat-label">Members</div></div>
      <div class="stat"><div class="stat-num" id="statLinks">0</div><div class="stat-label">Music links</div></div>
    </div>

    <div style="margin-top:0.75rem">
      <select id="styleSelect" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:'DM Mono',monospace;font-size:0.85rem;padding:0.65rem 1rem;border-radius:2px;cursor:pointer">
        <option value="warm">🎵 Warm community recap</option>
        <option value="dylan">📻 Bob Dylan Radio Hour</option>
        <option value="bbc">🎙️ BBC Radio 6 presenter</option>
        <option value="rolling_stone">📰 Rolling Stone review</option>
        <option value="hunter">🌶️ Hunter S. Thompson</option>
        <option value="plain">📋 Just the facts</option>
      </select>
    </div>
    <button class="btn btn-gold" id="summariseBtn" onclick="summarise()" disabled>✦ Generate Weekly Summary</button>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Reading the conversations...</div>
  </div>

  <div class="summary" id="summaryOutput"></div>

</div>

<script>
let chatData = {}; // { weekKey: { messages: [], members: Set, links: [] } }
let allLines = [];

// ── File handling ────────────────────────────────────────────────────────────
const dropZone = document.getElementById('dropZone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => { e.preventDefault(); dropZone.classList.remove('drag-over'); handleFile(e.dataTransfer.files[0]); });

async function handleFile(file) {
  if (!file) return;
  let text = '';
  if (file.name.endsWith('.zip')) {
    dropZone.textContent = 'ZIP files not supported here — please export as .txt';
    return;
  }
  text = await file.text();
  parseChat(text);
}

function parseChat(text) {
  allLines = text.split('\n');
  chatData = {};

  const dateRe = /^\[?(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4}),?\s+\d{1,2}:\d{2}/;
  const urlRe = /https?:\/\/[^\s]+/g;
  const musicDomains = ['spotify.com', 'youtu.be', 'youtube.com', 'apple.com/album', 'music.apple.com', 'bandcamp.com', 'spotify.link'];

  for (const line of allLines) {
    const dateMatch = line.match(dateRe);
    if (!dateMatch) continue;

    let day = parseInt(dateMatch[1]);
    let month = parseInt(dateMatch[2]);
    let year = parseInt(dateMatch[3]);
    if (year < 100) year += 2000;

    const date = new Date(year, month - 1, day);
    const weekKey = getWeekKey(date);

    // Extract member name and message
    const msgMatch = line.match(/\]?\s*~?\s*([^:]+?):\s*(.+)$/);
    if (!msgMatch) continue;

    const member = msgMatch[1].trim();
    const message = msgMatch[2].trim();

    // Skip system messages
    if (member.includes('🎵') || message.startsWith('‎') || message === 'null') continue;

    if (!chatData[weekKey]) {
      chatData[weekKey] = { messages: [], members: new Set(), links: [], date };
    }

    chatData[weekKey].members.add(member);

    // Check for music links
    const urls = message.match(urlRe) || [];
    const musicLinks = urls.filter(u => musicDomains.some(d => u.includes(d)));
    chatData[weekKey].links.push(...musicLinks);

    // Only include non-link messages for summary (strip the URL lines)
    const cleanMsg = message.replace(urlRe, '').trim();
    if (cleanMsg && cleanMsg.length > 3 && !cleanMsg.startsWith('<') && member !== 'You') {
      chatData[weekKey].messages.push({ member, message: cleanMsg, full: message });
    }
  }

  // Populate week dropdown — most recent first
  const weeks = Object.keys(chatData).sort().reverse();
  const select = document.getElementById('weekDropdown');
  select.innerHTML = '<option value="">Select a week...</option>';

  for (const week of weeks) {
    const d = chatData[week].date;
    const label = `W${getWeekNum(d)} — ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' })} · ${chatData[week].messages.length} msgs`;
    const opt = document.createElement('option');
    opt.value = week;
    opt.textContent = label;
    select.appendChild(opt);
  }

  // Auto-select most recent week
  if (weeks.length > 0) {
    select.value = weeks[0];
    updateStats();
  }

  document.getElementById('weekSelect').style.display = 'block';
  dropZone.textContent = `✓ Loaded ${allLines.length.toLocaleString()} lines · ${weeks.length} weeks`;
  dropZone.classList.add('loaded');
}

function getWeekKey(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  return d.getFullYear() + '-W' + String(getWeekNum(d)).padStart(2, '0');
}

function getWeekNum(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function updateStats() {
  const week = document.getElementById('weekDropdown').value;
  const statsRow = document.getElementById('statsRow');
  const btn = document.getElementById('summariseBtn');

  if (!week || !chatData[week]) {
    statsRow.style.display = 'none';
    btn.disabled = true;
    return;
  }

  const data = chatData[week];
  document.getElementById('statMessages').textContent = data.messages.length;
  document.getElementById('statMembers').textContent = data.members.size;
  document.getElementById('statLinks').textContent = data.links.length;
  statsRow.style.display = 'flex';
  btn.disabled = false;
}

// ── Claude summarisation ─────────────────────────────────────────────────────
async function summarise() {
  const week = document.getElementById('weekDropdown').value;
  if (!week || !chatData[week]) return;

  const data = chatData[week];
  document.getElementById('loading').classList.add('active');
  document.getElementById('summariseBtn').disabled = true;
  document.getElementById('summaryOutput').classList.remove('active');

  const loadingTexts = [
    'Reading the conversations...',
    'Finding the highlights...',
    'Spotting the debates...',
    'Curating the music moments...',
    'Almost there...'
  ];
  let li = 0;
  const loadingInterval = setInterval(() => {
    document.getElementById('loadingText').textContent = loadingTexts[li++ % loadingTexts.length];
  }, 2000);

  try {
    // Prepare messages for Claude — limit to ~400 messages to stay within token limit
    const msgs = data.messages.slice(0, 400);
    const chatText = msgs.map(m => `${m.member}: ${m.message}`).join('\n');
    const linkCount = data.links.length;
    const memberList = [...data.members].join(', ');

    const style = document.getElementById('styleSelect').value;

    const styleInstructions = {
      warm: 'Write a warm, celebratory summary as a fellow music lover. Use sections: THE WEEK IN MUSIC, HIGHLIGHTS, DEBATES & DISCUSSIONS, MOST ACTIVE MEMBERS, MUSIC SHARED. Quote members by name. Keep it celebratory.',
      dylan: 'Write this exactly like Bob Dylan presenting his Theme Time Radio Hour. Rambling, poetic, full of unexpected connections between artists and eras. Reference old bluesmen, strange facts, weave the week into a monologue. Start with a philosophical observation. End with a song dedication. Use "Well..." a lot.',
      bbc: 'Write this as a BBC Radio 6 Music presenter doing a weekly roundup — warm, knowledgeable, slightly dry British wit. Reference conversations as if on air. Use phrases like "quite remarkable", "rather wonderful", "and if you haven't heard this yet..."',
      rolling_stone: 'Write this as a Rolling Stone feature — punchy lede, cultural context, name-drop the right artists, treat the group like a scene worth documenting. Use bold section headers. End with a member quote as the kicker.',
      hunter: 'Write this as Hunter S. Thompson covering a music group for Rolling Stone circa 1972. Gonzo journalism — you're a participant, it's chaotic, the music is urgent. Fear and Loathing energy but about music.',
      plain: 'Write a concise plain-text summary for pasting into WhatsApp. No formatting, just 3-4 short paragraphs covering what was shared and discussed. Under 200 words.'
    };

    const prompt = `You are summarising a week of conversations from "Music Only" — a passionate WhatsApp group of music lovers who have been sharing music daily for 6 years.

Here are the conversations from this week (${msgs.length} messages from ${data.members.size} members, plus ${linkCount} music links shared):

${chatText}

${styleInstructions[style]}

Important: Quote actual members by name where relevant. Only reference music and conversations that actually appear above.`;

    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }]
      })
    });

    const result = await response.json();
    const summary = result.content?.[0]?.text || 'Could not generate summary';

    clearInterval(loadingInterval);
    document.getElementById('loading').classList.remove('active');
    renderSummary(week, data, summary);
  } catch(e) {
    clearInterval(loadingInterval);
    document.getElementById('loading').classList.remove('active');
    document.getElementById('summariseBtn').disabled = false;
    alert('Error: ' + e.message);
  }
}

function renderSummary(week, data, summaryText) {
  const d = data.date;
  const weekLabel = `Week ${getWeekNum(d)} · ${d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' })}`;

  // Parse sections from the summary
  const sections = summaryText.split(/\*\*([^*]+)\*\*/g).filter(s => s.trim());

  let html = `
    <div class="summary-header">
      <h2>Music Only</h2>
      <p>${weekLabel} · ${data.messages.length} messages · ${data.members.size} members · ${data.links.length} music links</p>
    </div>
    <div class="card">
      <div class="card-label">Weekly Summary <button class="copy-btn" onclick="copyText()">⎘ Copy</button></div>
      <div class="summary-content" id="summaryText">${escapeHtml(summaryText)}</div>
    </div>
  `;

  const output = document.getElementById('summaryOutput');
  output.innerHTML = html;
  output.classList.add('active');
  document.getElementById('summariseBtn').disabled = false;

  // Scroll to summary
  output.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
}

function copyText() {
  const text = document.getElementById('summaryText')?.innerText || '';
  navigator.clipboard.writeText(text).then(() => {
    document.querySelector('.copy-btn').textContent = '✓ Copied!';
    setTimeout(() => document.querySelector('.copy-btn').textContent = '⎘ Copy', 2000);
  });
}
</script>
</body>
</html>
